<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Schrödinger Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed WebGL field; one translucent instrument panel docked top-right; hint line bottom-left. Single dark look by choice. */
:root {
  --void: #04050a;
  --panel: rgba(11, 13, 20, 0.84);
  --line: rgba(196, 206, 236, 0.13);
  --ink: #e7eaf3;
  --muted: #8d95aa;
  --accent: #a9c2ff;
  --track: rgba(196, 206, 236, 0.18);
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--void); color: var(--ink);
  font: 13px/1.4 var(--font-body);
  -webkit-user-select: none; user-select: none;
}
#sim { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

.panel {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: calc(12px + env(safe-area-inset-right, 0px));
  width: 280px; max-width: calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  z-index: 2;
}
.panel-head {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; width: 100%;
}
.panel-head h1 { margin: 0; font: 400 22px/1 var(--font-display); letter-spacing: 0.005em; flex: 1; }
.panel-head h1 i { font-style: italic; color: var(--accent); }
.panel-head .chev { color: var(--muted); font-size: 11px; transition: transform 0.2s; }
.panel.collapsed .chev { transform: rotate(-90deg); }
.panel.collapsed .panel-body { display: none; }
.panel-body { overflow-y: auto; overscroll-behavior: contain; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 14px; }
.panel-body::-webkit-scrollbar { width: 6px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--track); border-radius: 3px; }

.legend { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; padding-top: 2px; }
.legend canvas { width: 76px; height: 76px; display: block; }
.legend dl { margin: 0; display: grid; gap: 6px; font-size: 12px; }
.legend dt { font: 500 10px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.legend dd { margin: 2px 0 0; }
.readout { font: 11px/1.5 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.readout b { color: var(--ink); font-weight: 500; }

.group { display: flex; flex-direction: column; gap: 9px; border-top: 1px solid var(--line); padding-top: 12px; }
.group h2 { margin: 0; font: 500 10px/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.ctl { display: flex; flex-direction: column; gap: 4px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; }
.ctl output { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ctl.inline { flex-direction: row; align-items: center; justify-content: space-between; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: none; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; background: linear-gradient(to right, var(--accent) var(--fill, 50%), var(--track) var(--fill, 50%)); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 3px; background: var(--track); border-radius: 2px; }
input[type=range]::-moz-range-progress { height: 3px; background: var(--accent); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%; background: var(--ink); border: 0; }
input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--ink); border: 0; }

select {
  width: 100%; font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
}
select option { background: #151821; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 6px 0; cursor: pointer; box-shadow: 0 0 0 0.5px var(--line); }
.seg button[aria-pressed=true] { color: var(--void); background: var(--accent); font-weight: 500; }

.switch { position: relative; width: 30px; height: 17px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 9px; background: var(--track); transition: background 0.15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--ink); transition: transform 0.15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(13px); background: var(--void); }

.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn {
  font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px;
}
.btn:hover { background: rgba(255, 255, 255, 0.1); }
.btn kbd { font: 10px var(--font-mono); color: var(--muted); }
#a-reverse, #a-picture, #a-h3d { grid-column: span 2; }
.note { margin: 0; font-size: 12px; color: var(--muted); text-wrap: pretty; }
.note em { font-style: normal; color: var(--ink); }
.credits { margin: 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 11px; line-height: 1.5; color: var(--muted); text-wrap: pretty; }
.credits a { color: var(--accent); text-decoration: underline; text-decoration-color: var(--track); text-underline-offset: 2px; }
.credits a:hover { text-decoration-color: var(--accent); }

button:focus-visible, select:focus-visible, input:focus-visible + span, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hint {
  position: fixed;
  left: calc(14px + env(safe-area-inset-left, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  right: calc(14px + env(safe-area-inset-right, 0px));
  margin: 0; font: 12px/1.5 var(--font-mono); color: var(--muted); pointer-events: none;
  text-shadow: 0 1px 6px #000; transition: opacity 1.2s;
}
.hint.dim { opacity: 0.35; }
.score {
  position: fixed; left: 50%; top: calc(52px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  font: 400 34px/1 var(--font-display); color: var(--ink); white-space: pre; pointer-events: none;
  font-variant-numeric: tabular-nums; text-shadow: 0 1px 10px #000;
}
.toast {
  position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  font: 12px var(--font-mono); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  padding: 6px 12px; border-radius: 6px; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
#ov { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; mix-blend-mode: screen; }
.knob {
  position: fixed; z-index: 3; width: 220px; display: flex; flex-direction: column; gap: 10px; padding: 10px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
}
.knob h3 { margin: 0; font: 500 10px/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
body.embed .panel, body.embed .hint { display: none; }
@media (max-width: 640px) { .panel { width: 260px; } .hint { font-size: 11px; } }
@media (prefers-reduced-motion: reduce) { .hint, .toast, .switch span, .switch span::after, .panel-head .chev { transition: none; } }
</style>

<canvas id="sim"></canvas>
<canvas id="ov" aria-hidden="true"></canvas>

<aside class="panel" id="panel">
  <button class="panel-head" id="panelToggle" aria-expanded="true" aria-controls="panelBody">
    <h1><i>ψ</i> Schrödinger</h1><span class="chev" aria-hidden="true">▼</span>
  </button>
  <div class="panel-body" id="panelBody">
    <div class="legend">
      <canvas id="wheel" width="152" height="152" aria-label="Colour key: hue is the phase of psi, brightness its amplitude"></canvas>
      <dl>
        <div><dt>Hue</dt><dd>phase arg ψ</dd></div>
        <div><dt>Brightness</dt><dd>amplitude |ψ|</dd></div>
        <div class="readout">t = <b id="clock">0</b><br><span title="lattice units">ħ = m = Δx = 1</span></div>
      </dl>
    </div>
    <div class="btns" id="actions"></div>
    <div id="groups"></div>
    <p class="credits">Created by <a href="https://www.conquerlangen.de/team" target="_blank" rel="noopener">Daniel Burgarth</a> using Claude, the Schrödinger equation, and Pavel Dobryakov's amazing <a href="https://github.com/PavelDoGreat/WebGL-Fluid-Simulation" target="_blank" rel="noopener">WebGL-Fluid-Simulation</a>. Inspired by Bernd Thaller's visual quantum mechanics books.</p>
  </div>
</aside>

<p class="hint" id="hint"></p>
<div class="toast" id="toast" role="status"></div>
<div class="score" id="score" hidden aria-label="Score, left and right"></div>

<script src="maze-levels.js"></script>
<script>
'use strict';
(() => {
const canvas = document.getElementById('sim');
// #embed: the level editor drives this page through postMessage; only the board shows
const EMBED = location.hash === '#embed' || new URLSearchParams(location.search).has('embed');
if (EMBED) document.body.classList.add('embed');
const gl = canvas.getContext('webgl2', { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
function fail(msg) {
  const d = document.createElement('div'); d.className = 'fail'; d.textContent = msg; document.body.appendChild(d);
}
if (!gl) { fail('This simulation needs WebGL 2, which this browser does not offer.'); return; }

// ---------- formats ----------
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('EXT_color_buffer_half_float');
function canRender(internal, type) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, 4, 4, 0, gl.RGBA, type, null);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(f); gl.deleteTexture(t);
  return ok;
}
const F32 = canRender(gl.RGBA32F, gl.FLOAT), F16 = canRender(gl.RGBA16F, gl.HALF_FLOAT);
const SIMFMT = F32 ? { internal: gl.RGBA32F, type: gl.FLOAT } : F16 ? { internal: gl.RGBA16F, type: gl.HALF_FLOAT } : null;
const FXFMT = F16 ? { internal: gl.RGBA16F, type: gl.HALF_FLOAT } : { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE };
if (!SIMFMT) { fail('This GPU cannot render to floating-point textures, which the simulation needs.'); return; }

// ---------- physics constants (lattice units: ħ = m = Δx = 1) ----------
const DT = 0.2;       // time per step: one leapfrog step, or two field steps of DT/2; stable while DT·max(16/3 + Vmax, −Vmin) < 2
const VMAX = 3.5;
// Coulomb centres V = −Z/√(r² + a²): softened over one cell, and kept above −VMIN so the leapfrog stays stable
const COULOMB_A = 1, VMIN = 8;
// ping-pong paddles: below the 1D band top 8/3, so a paddle swept over ψ does not trap it
const PAD_V = 2.5, PAD_HALF = 0.1, PAD_SPEED = 0.7;   // height, half length (fraction of H), cells per unit time
// The maze always runs on the same grid: a board 1.6 × MAZE_BOARD cells inside an absorbing margin, shown letterboxed,
// so a level plays the same on every screen and the editor's tests match what players get
const MAZE_BOARD = 512, MAZE_MARGIN = 48;
const MAZE_GRID = [Math.ceil(1.6 * MAZE_BOARD) + 2 * MAZE_MARGIN, MAZE_BOARD + 2 * MAZE_MARGIN];

// ---------- shaders ----------
const VS = `#version 300 es
layout(location = 0) in vec2 aPos;
out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const HEAD = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
in vec2 vUv;
out vec4 o;
`;

// Rounded-rectangle paddles, added to V on the fly so they can move every step
const PADDLE = `
uniform vec4 uPad;     // paddle centres in cells: left y, right y, left x, right x
uniform vec3 uPadDim;  // half thickness, half length, height (0 = no paddles)
float paddleMask(vec2 q) {
  if (uPadDim.z == 0.0) return 0.0;
  float r = uPadDim.x, m = 0.0;
  for (int i = 0; i < 2; i++) {
    vec2 d = abs(q - (i == 0 ? uPad.zx : uPad.wy)) - uPadDim.xy + r;
    float sd = length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - r;
    m = max(m, 1.0 - smoothstep(-0.75, 0.75, sd));
  }
  return m;
}`;

// Visscher staggered leapfrog: R(t+dt) = R + dt·H I,  I(t+3dt/2) = I − dt·H R,  H = −½∇² + V
const STEP_LF_FS = HEAD + `
uniform sampler2D uState;
uniform sampler2D uPot;
uniform ivec2 uSize;
uniform int uBoundary;   // 0 absorbing, 1 hard wall, 2 periodic, 3 absorbing left/right only
uniform int uPart;       // 0 update R, 1 update I, 2 reverse time, 3 / 4 stagger / unstagger I by dt/2
uniform float uDt;
uniform float uFade;
uniform float uAbsW;
uniform float uAbsG;
uniform vec3 uDet;       // maze detector: centre and radius in cells (radius 0 = none)
${PADDLE}
vec2 at(ivec2 p) {
  if (uBoundary == 2) return texelFetch(uState, (p + uSize) % uSize, 0).xy;
  if (any(lessThan(p, ivec2(0))) || any(greaterThanEqual(p, uSize))) return vec2(0.0);
  return texelFetch(uState, p, 0).xy;
}
void main() {
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec2 c = texelFetch(uState, p, 0).xy;
  float V = texelFetch(uPot, p, 0).x;
  float pm = paddleMask(vec2(p) + 0.5);
  if (pm > 0.0) V = max(V, pm * uPadDim.z);
  // 4th-order stencil: dispersion error O(k⁶) rather than O(k⁴), so fast packets keep their shape
  vec2 n1 = at(p + ivec2(1, 0)) + at(p - ivec2(1, 0)) + at(p + ivec2(0, 1)) + at(p - ivec2(0, 1));
  vec2 n2 = at(p + ivec2(2, 0)) + at(p - ivec2(2, 0)) + at(p + ivec2(0, 2)) + at(p - ivec2(0, 2));
  vec2 lap = (16.0 * n1 - n2 - 60.0 * c) / 12.0;
  // Reversal: the state holds R(t) and I(t + dt/2). Undoing the last I update gives I(t − dt/2), and
  // (R(t), −I(t − dt/2)) is the conjugate wave, which the leapfrog then runs back along the same steps.
  if (uPart == 2) { o = vec4(c.x, -(c.y + uDt * (-0.5 * lap.x + V * c.x)), 0.0, 1.0); return; }
  // Handing over: the field solver holds ψ(t), the leapfrog I half a step ahead, I(t + dt/2) ≈ I(t) − ½dt·HR
  if (uPart >= 3) { o = vec4(c.x, c.y + (uPart == 3 ? -0.5 : 0.5) * uDt * (-0.5 * lap.x + V * c.x), 0.0, 1.0); return; }
  if (uPart == 0) c.x += uDt * (-0.5 * lap.y + V * c.y);
  else            c.y -= uDt * (-0.5 * lap.x + V * c.x);
  float g = uFade;
  if (uBoundary == 0 || uBoundary == 3) {
    int dx = min(p.x, uSize.x - 1 - p.x);
    float d = float(uBoundary == 3 ? dx : min(dx, min(p.y, uSize.y - 1 - p.y)));
    float s = clamp(1.0 - d / uAbsW, 0.0, 1.0);
    g += uAbsG * s * s;
  }
  if (uDet.z > 0.0) {
    float s = clamp(1.0 - length(vec2(p) + 0.5 - uDet.xy) / uDet.z, 0.0, 1.0);
    g += 0.3 * s * s;
  }
  c *= exp(-0.5 * g * uDt);
  o = vec4(c, 0.0, 1.0);
}`;

// With a magnetic field: second-order differencing ψ(t+dt) = ψ(t−dt) − 2i·dt·Hψ(t), H = ½(p − A)² + V; the state holds ψ(t) in xy and
// ψ(t−dt) in zw. A uniform field B enters as a Peierls phase e^(−iθ) on every link, in the symmetric gauge
// A = ½B ẑ×(r − centre): θ is A at the link's midpoint times its length, so each cell encloses flux B exactly.
const STEP_B_FS = HEAD + `
uniform sampler2D uState;
uniform sampler2D uPot;
uniform ivec2 uSize;
uniform int uBoundary;   // 0 absorbing, 1 hard wall, 2 periodic, 3 absorbing left/right only
uniform int uPart;       // 0 step, 1 rebuild ψ(t−dt) from ψ(t), 2 reverse time
uniform float uDt;
uniform float uFade;
uniform float uAbsW;
uniform float uAbsG;
uniform float uB;        // magnetic field, flux per cell
uniform vec2 uCen;       // gauge centre
uniform vec3 uDet;       // maze detector: centre and radius in cells (radius 0 = none)
${PADDLE}
vec2 at(ivec2 p) {
  if (uBoundary == 2) return texelFetch(uState, (p + uSize) % uSize, 0).xy;
  if (any(lessThan(p, ivec2(0))) || any(greaterThanEqual(p, uSize))) return vec2(0.0);
  return texelFetch(uState, p, 0).xy;
}
vec2 hop(ivec2 q, float th) {   // e^(−iθ)·ψ(q)
  vec2 v = at(q);
  float c = cos(th), s = sin(th);
  return vec2(c * v.x + s * v.y, c * v.y - s * v.x);
}
void main() {
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 st = texelFetch(uState, p, 0);
  vec2 c = st.xy, prev = st.zw;
  float V = texelFetch(uPot, p, 0).x;
  float pm = paddleMask(vec2(p) + 0.5);
  if (pm > 0.0) V = max(V, pm * uPadDim.z);
  vec2 r = vec2(p) + 0.5 - uCen;
  float tx = -0.5 * uB * r.y, ty = 0.5 * uB * r.x;   // phases of the links to +x and to +y
  // 4th-order stencil: dispersion error O(k⁶) rather than O(k⁴), so fast packets keep their shape
  vec2 n1 = hop(p + ivec2(1, 0), tx) + hop(p - ivec2(1, 0), -tx) + hop(p + ivec2(0, 1), ty) + hop(p - ivec2(0, 1), -ty);
  vec2 n2 = hop(p + ivec2(2, 0), 2.0 * tx) + hop(p - ivec2(2, 0), -2.0 * tx) + hop(p + ivec2(0, 2), 2.0 * ty) + hop(p - ivec2(0, 2), -2.0 * ty);
  vec2 Hc = -0.5 * (16.0 * n1 - n2 - 60.0 * c) / 12.0 + V * c;
  if (uPart == 1) { o = vec4(c, c + uDt * vec2(-Hc.y, Hc.x)); return; }   // ψ(t−dt) ≈ ψ + i·dt·Hψ
  vec2 nxt = prev + 2.0 * uDt * vec2(Hc.y, -Hc.x);
  // Reversal: the scheme is symmetric in time, so (ψ*(t), ψ*(t+dt)) runs back along the same steps, in the field −B
  if (uPart == 2) { o = vec4(c.x, -c.y, nxt.x, -nxt.y); return; }
  float g = uFade;
  if (uBoundary == 0 || uBoundary == 3) {
    int dx = min(p.x, uSize.x - 1 - p.x);
    float d = float(uBoundary == 3 ? dx : min(dx, min(p.y, uSize.y - 1 - p.y)));
    float s = clamp(1.0 - d / uAbsW, 0.0, 1.0);
    g += uAbsG * s * s;
  }
  if (uDet.z > 0.0) {
    float s = clamp(1.0 - length(vec2(p) + 0.5 - uDet.xy) / uDet.z, 0.0, 1.0);
    g += 0.3 * s * s;
  }
  float f = exp(-g * uDt);
  o = vec4(nxt * f, c * f);
}`;

// Adds (or replaces with) a Gaussian packet A·exp(−½|x/σ|²)·e^{i(k·x + φ)}
const SPLAT_FS = HEAD + `
uniform sampler2D uState;
uniform vec2 uSizeF;
uniform vec2 uPoint;
uniform vec2 uSigma;    // x: along uDir, y: across it
uniform vec2 uDir;
uniform vec2 uK;
uniform float uAmp;
uniform float uPhase;
uniform int uAlign;
uniform int uReplace;
uniform int uWrap;
uniform float uChirp;   // > 0: converging phase −½β|x|², so the packet focuses before it spreads
void main() {

    // a part that both turns and slides slides when grabbed at its ring, and turns when grabbed further out
    const q = maze.parts[i], c = boardCell(q.at), A = q.adjust;
    const slide = A.slide && q.track && (!A.angle || Math.hypot(p.x - c.x, p.y - c.y) < cssToCells(16));
    pointers.set(e.pointerId, { ...p, t: e.timeStamp, vx: 0, vy: 0, moved: 0, mode: 'part', part: i, drag: slide ? 'slide' : A.angle ? 'turn' : null,
                                grab: q.angle - Math.atan2(p.y - c.y, p.x - c.x) * 180 / Math.PI });
    hint.classList.add('dim');
    return;
  }
  const side = p.x < W / 2 ? 0 : 1;
  if (game.on && (mode === 'wave' || mode === 'front')) { mode = 'paddle'; game.target[side] = p.y / H; }
  pointers.set(e.pointerId, { ...p, t: e.timeStamp, vx: 0, vy: 0, acc: 0, moved: 0, mode, side, phase: Math.random() * Math.PI * 2, first: true });
  if (mode === 'front' || mode === 'grating' || mode === 'lattice') aim = { ax: p.x, ay: p.y, bx: p.x, by: p.y, id: e.pointerId, line: mode === 'grating', rect: mode === 'lattice' };
  else if (mode === 'wall' || mode === 'erase') queue.push(() => paint(p, p, mode === 'erase'));
  else if (mode === 'charge') queue.push(() => addCharge(p, params.charge));
  hint.classList.add('dim');
});
canvas.addEventListener('pointermove', e => {
  const s = pointers.get(e.pointerId);
  if (!s) return;
  const p = toCells(e), dt = Math.max(4, e.timeStamp - s.t) / 1000;
  const dx = p.x - s.x, dy = p.y - s.y, a = 1 - Math.exp(-dt / 0.06);
  s.vx += (dx / dt - s.vx) * a; s.vy += (dy / dt - s.vy) * a;
  const from = { x: s.x, y: s.y };
  s.x = p.x; s.y = p.y; s.t = e.timeStamp;
  const d = Math.hypot(dx, dy);
  s.moved += d;
  if (s.mode === 'wave') {
    s.acc += d;
    const sig = params.sigma * scale();
    if (s.acc >= Math.max(2, 0.7 * sig)) {
      s.acc = 0;
      const [kx, ky] = kFromVelocity(s.vx, s.vy), first = s.first;
      s.first = false;
      queue.push(() => splat({ x: p.x, y: p.y, sx: sig, kx, ky, phase: first ? s.phase : 0, align: !first }));
    }
  } else if (s.mode === 'front' || s.mode === 'grating' || s.mode === 'lattice') {
    if (aim?.id === e.pointerId) { aim.bx = p.x; aim.by = p.y; }
  } else if (s.mode === 'part') {
    const q = maze.parts[s.part], c = boardCell(q.at);
    if (!maze.flying && s.drag === 'turn') {
      const a = ((5 * Math.round((Math.atan2(p.y - c.y, p.x - c.x) * 180 / Math.PI + s.grab) / 5)) % 180 + 180) % 180;   // 5° steps
      if (a !== q.angle) { q.angle = a; partsChanged(`${a}°`); }
    } else if (!maze.flying && s.drag === 'slide' && s.moved > cssToCells(3)) {
      const at = slideTo(q, p);
      if (at[0] !== q.at[0] || at[1] !== q.at[1]) { q.at = at; partsChanged(); }
    }
  } else if (s.mode === 'paddle') {
    game.target[s.side] = p.y / H;
  } else if (s.mode !== 'charge') {
    queue.push(() => paint(from, p, s.mode === 'erase'));
  }
});
function endPointer(e) {
  const s = pointers.get(e.pointerId);
  if (!s) return;
  pointers.delete(e.pointerId);
  if (s.mode === 'part') { if (e.type === 'pointerup' && s.moved < cssToCells(5)) openKnob(s.part); return; }
  if (s.mode === 'paddle') game.target[s.side] = null;
  if (s.mode === 'grating' && aim?.id === e.pointerId) {
    const a = { x: aim.ax, y: aim.ay }, b = { x: aim.bx, y: aim.by };
    aim = null;
    if (e.type === 'pointerup') queue.push(() => paintGrating(a, b));
  }
  if (s.mode === 'lattice' && aim?.id === e.pointerId) {
    const a = { x: aim.ax, y: aim.ay }, b = { x: aim.bx, y: aim.by };
    aim = null;
    if (e.type === 'pointerup') queue.push(() => paintLattice(a, b));
  }
  if (s.mode === 'front' && aim?.id === e.pointerId) {
    const dx = aim.bx - aim.ax, dy = aim.by - aim.ay, len = Math.hypot(dx, dy), { ax, ay } = aim;
    aim = null;
    if (e.type !== 'pointerup' || len < 4) return;
    // launch from the press point towards the release point; a quarter screen of drag gives k = 1
    const dir = [dx / len, dy / len], k = Math.min(1.25, params.kick * len / (0.25 * Math.min(W, H)));
    queue.push(() => splat({ x: ax, y: ay, sx: params.sigma * scale(), sy: frontSigma(), dir, kx: k * dir[0], ky: k * dir[1], phase: s.phase }));
  }
  if (s.mode === 'wave' && s.moved < 3) {
    const sig = params.sigma * scale();
    queue.push(() => splat({ x: s.x, y: s.y, sx: sig, phase: s.phase }));
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

const controls = {};

function slider(o) {
  const id = 'c-' + o.k, row = el('div', 'ctl');
  row.innerHTML = `<label for="${id}"><span>${o.label}</span><output id="${id}-o"></output></label><input type="range" id="${id}" min="${o.min}" max="${o.max}" step="${o.step}">`;
  const inp = row.querySelector('input'), out = row.querySelector('output');
  const sync = () => {
    inp.value = params[o.k]; out.textContent = o.fmt(params[o.k]);
    inp.style.setProperty('--fill', ((params[o.k] - o.min) / (o.max - o.min) * 100) + '%');
  };
  inp.addEventListener('input', () => { params[o.k] = parseFloat(inp.value); sync(); o.change?.(); });
  controls[o.k] = { sync }; sync();
  return row;
}
function select(o) {
  const id = 'c-' + o.k, row = el('div', 'ctl');
  row.innerHTML = `<label for="${id}"><span>${o.label}</span></label><select id="${id}">${o.options.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
  const s = row.querySelector('select');
  const sync = () => { s.value = String(params[o.k]); };
  s.addEventListener('change', () => { params[o.k] = o.num ? +s.value : s.value; o.change?.(); });
  controls[o.k] = { sync }; sync();
  return row;
}
function toggle(o) {
  const id = 'c-' + o.k, row = el('div', 'ctl inline');
  row.innerHTML = `<label for="${id}">${o.label}</label><span class="switch"><input type="checkbox" id="${id}"><span></span></span>`;
  const c = row.querySelector('input');
  const sync = () => { c.checked = params[o.k]; };
  c.addEventListener('change', () => { params[o.k] = c.checked; o.change?.(); });
  controls[o.k] = { sync }; sync();
  return row;
}
function segmented(o) {
  const row = el('div', 'ctl'), seg = el('div', 'seg');
  seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', o.label);
  const btns = o.options.map(([v, t]) => {
    const b = el('button', '', t); b.type = 'button'; b.id = 'c-' + o.k + '-' + v;
    b.addEventListener('click', () => { setParam(o.k, v); o.change?.(); });
    seg.appendChild(b); return [v, b];
  });
  const sync = () => btns.forEach(([v, b]) => b.setAttribute('aria-pressed', String(params[o.k] === v)));
  row.appendChild(el('label', '', `<span>${o.label}</span>`)); row.appendChild(seg);
  controls[o.k] = { sync }; sync();

}
function buttons(items) {
  const row = el('div', 'btns');
  for (const [label, fn, key, id] of items) {
    const b = el('button', 'btn', `<span>${label}</span>${key ? `<kbd>${key}</kbd>` : ''}`);
    b.type = 'button'; b.id = id; b.addEventListener('click', fn); row.appendChild(b);
  }
  return row;
}

const f2 = v => v.toFixed(2), f1 = v => v.toFixed(1);
const actions = [
  ['Random', () => { for (let i = 0; i < 5; i++) queue.push(() => splat(randomPacket())); }, 'Space', 'a-random'],
  ['Measure', () => queue.push(measure), 'M', 'a-measure'],

const BRUSH_NOTES = {
  wave: 'Drag to paint packets that travel with your stroke. Click for a packet at rest.',
  front: 'Drag in the direction of travel and let go to launch a long, plane-wave-like front. A longer drag gives more momentum.',
  wall: 'Drag to draw a barrier of height V₀. A negative V₀ draws an attractive well instead.',
  grating: 'Drag a straight line to place a grating: bars of height V₀ with clear slits between them. A negative V₀ gives a grating of wells.',
  lattice: 'Drag a rectangle to fill it with a square or Kagome lattice of sites of height V₀, sized by Wall thickness. A negative V₀ gives a lattice of wells; the Kagome preset uses V₀ = −0.15, spacing 14, thickness 8.',
  charge: 'Click to place a charge, V = −Z/r (softened over one cell). Positive Z attracts, negative Z repels. Clear walls removes it.',
  erase: 'Drag to remove barriers.',
};
const brushNote = el('p', 'note', BRUSH_NOTES[params.brush]);
const gratingRows = [
  slider({ k: 'gratP', label: 'Grating period', min: 4, max: 80, step: 1, fmt: v => Math.round(v * scale()) + ' Δx' }),

  slider({ k: 'latA', label: 'Site spacing', min: 6, max: 60, step: 0.5, fmt: v => Math.round(v * scale()) + ' Δx' }),
  slider({ k: 'latAngle', label: 'Lattice angle', min: 0, max: 90, step: 1, fmt: v => v + '°' }),
];
const chargeRow = slider({ k: 'charge', label: 'Charge Z', min: -10, max: 10, step: 0.5, fmt: v => (v > 0 ? '+' : '') + v + (v > 0 ? ' attracts' : v < 0 ? ' repels' : '') });
latticeRows[0].querySelector('.seg').style.gridTemplateColumns = 'repeat(2, 1fr)';
const showGrating = () => {
  chargeRow.hidden = params.brush !== 'charge';
  gratingRows.forEach(r => { r.hidden = params.brush !== 'grating'; });
  latticeRows.forEach(r => { r.hidden = params.brush !== 'lattice'; });
};
showGrating();

const ballNoteEl = el('p', 'note');
function ballNote() {
  const n = sharpCrossings();
  ballNoteEl.innerHTML = `The ball stays within √2·σ for about <em>${n < 0.1 ? n.toFixed(2) : n.toFixed(1)}</em> crossings of the table. ` +
    'A narrow ball spreads <em>faster</em>: sharp crossings ≈ σ²·v / distance. Changes apply from the next serve.';
}
const groups = [
  ['Scene', [
    select({ k: 'preset', label: 'Preset', options: Object.entries(PRESETS).map(([k, p]) => [k, p.label]), change: () => { document.activeElement?.blur(); queue.push(loadPreset); } }),
    el('p', 'note', '<span id="presetNote"></span>'),
    select({ k: 'boundary', label: 'Edges', options: [['absorb', 'Absorbing'], ['reflect', 'Hard walls'], ['wrap', 'Periodic (torus)'], ['goals', 'Absorbing left and right']] }),
    buttons([['Reset scene', () => queue.push(loadPreset), 'R', 'a-reset'], ['Clear walls', () => queue.push(clearWalls), '', 'a-walls'],
             ['Hydrogen in 3D →', () => { location.href = 'hydrogen-3d.html'; }, '', 'a-h3d']]),
  ]],
  ['Maze', [
    select({ k: 'level', label: 'Level', num: true, options: [], change: () => { document.activeElement?.blur(); queue.push(loadPreset); } }),
    el('p', 'note', '<span id="levelNote"></span>'),
    buttons([
      ['Fire', () => queue.push(fire), 'Space', 'a-fire'],
      ['Next level', () => { if (levelFile.length) { setParam('level', (params.level + 1) % levelFile.length); queue.push(loadPreset); } }, '', 'a-next'],
      ['Open levels…', () => levelInput.click(), '', 'a-open'],
      ['Level editor', () => { location.href = 'level-editor.html'; }, '', 'a-editor'],
    ]),
  ]],
  ['Game', [
    toggle({ k: 'cpu', label: 'Computer plays the right paddle' }),
    slider({ k: 'ballW', label: 'Ball width σ', min: 4, max: 60, step: 1, fmt: v => Math.round(v * scale()) + ' Δx', change: ballNote }),
    slider({ k: 'ballK', label: 'Ball momentum k', min: 0.4, max: 1.6, step: 0.05, fmt: f2, change: ballNote }),
    toggle({ k: 'focus', label: 'Focused serve', change: ballNote }),
    ballNoteEl,
  ]],
  ['Brush', [
    segmented({ k: 'brush', label: 'Draw', options: [['wave', 'Packet'], ['front', 'Front'], ['wall', 'Wall'], ['grating', 'Grating'], ['lattice', 'Lattice'], ['charge', 'Charge'], ['erase', 'Erase']], change: () => { brushNote.textContent = BRUSH_NOTES[params.brush]; showGrating(); } }),
    brushNote,
    ...gratingRows,
    ...latticeRows,
    chargeRow,
    slider({ k: 'sigma', label: 'Packet width σ', min: 4, max: 40, step: 1, fmt: v => Math.round(v * scale()) + ' Δx', change: null }),
    slider({ k: 'frontLen', label: 'Wavefront length', min: 0.2, max: 2, step: 0.05, fmt: v => Math.round(v * Math.min(W, H)) + ' Δx' }),
    slider({ k: 'amp', label: 'Amplitude', min: 0.1, max: 2, step: 0.05, fmt: f2 }),
    slider({ k: 'kick', label: 'Momentum per drag speed', min: 0.2, max: 3, step: 0.05, fmt: v => v.toFixed(2) + '×' }),
    slider({ k: 'wallH', label: 'Wall height V₀', min: -VMAX, max: VMAX, step: 0.05, fmt: f2 }),
    slider({ k: 'brushW', label: 'Wall thickness', min: 1, max: 20, step: 0.5, fmt: v => (v * scale() * 2).toFixed(0) + ' Δx' }),
  ]],
  ['Simulation', [
    slider({ k: 'steps', label: 'Speed', min: 1, max: 60, step: 1, fmt: v => v + ' steps/frame' }),
    slider({ k: 'B', label: 'Magnetic field B', min: -0.06, max: 0.06, step: 0.001, fmt: v => v === 0 ? 'off' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(3) + ' · ℓ = ' + Math.round(1 / Math.sqrt(Math.abs(v))) + ' Δx' }),
    select({ k: 'res', label: 'Grid (short side)', num: true, options: [256, 384, 512, 768, 1024].map(v => [v, v + ' cells']), change: () => queue.push(() => { const [w, h] = simDims(); state.free(); pot.free(); state = null; allocSim(w, h); loadPreset(); }) }),
    slider({ k: 'fade', label: 'Decay', min: 0, max: 1, step: 0.01, fmt: v => v === 0 ? 'off' : f2(v) }),
    toggle({ k: 'paused', label: 'Paused' }),
  ]],
  ['Display', [
    slider({ k: 'exposure', label: 'Exposure', min: 0.3, max: 6, step: 0.05, fmt: f2, change: drawWheel }),
    slider({ k: 'sat', label: 'Saturation', min: 0, max: 1.6, step: 0.05, fmt: f2, change: drawWheel }),
    toggle({ k: 'showPot', label: 'Show potential' }),

const groupsEl = document.getElementById('groups');

const sections = {};

// Level files: maze-levels.js beside the page, or any level file the player opens (.js or .json)

const pictureInput = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*', hidden: true });

window.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => {
  if (!e.dataTransfer.files.length) return;
  e.preventDefault();   // a dropped file would otherwise replace the page
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
  if (f) loadPicture(f); else toast('Drop a picture to quantize it.');
});
const levelInput = Object.assign(document.createElement('input'), { type: 'file', accept: '.js,.json', hidden: true });
document.body.appendChild(levelInput);
levelInput.addEventListener('change', () => {
  const f = levelInput.files[0];
  levelInput.value = '';
  if (!f) return;
  f.text().then(t => {
    levelFile = readLevelFile(t);
    params.level = 0; setLevelOptions(); setParam('preset', 'maze'); queue.push(loadPreset);
    toast(`Loaded ${levelFile.length} level${levelFile.length === 1 ? '' : 's'} from ${f.name}`);
  }).catch(() => toast(`${f.name} is not a maze level file.`));
});

const panel = document.getElementById('panel'), panelToggle = document.getElementById('panelToggle');
function setCollapsed(c) { panel.classList.toggle('collapsed', c); panelToggle.setAttribute('aria-expanded', String(!c)); }
panelToggle.addEventListener('click', () => setCollapsed(!panel.classList.contains('collapsed')));
if (window.innerWidth < 640) setCollapsed(true);

// Colour key: angle = phase, radius = amplitude (0 … 2)
function drawWheel() {
  const c = document.getElementById('wheel'), ctx = c.getContext('2d'), n = c.width, img = ctx.createImageData(n, n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const dx = (x + 0.5) / n * 2 - 1, dy = 1 - (y + 0.5) / n * 2, r = Math.hypot(dx, dy), i = (y * n + x) * 4;
    if (r > 1) { img.data[i + 3] = 0; continue; }
    const th = Math.atan2(dy, dx);
    let rgb = [0, 2.0943951, 4.1887902].map(o => 0.5 + 0.5 * Math.cos(th - o));
    const l = 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2];
    const b = 1 - Math.exp(-params.exposure * r * 2);
    rgb = rgb.map(v => Math.min(1, Math.max(0, l + (v - l) * params.sat)) * b);
    img.data[i] = rgb[0] * 255; img.data[i + 1] = rgb[1] * 255; img.data[i + 2] = rgb[2] * 255;
    img.data[i + 3] = 255 * Math.min(1, (1 - r) * n * 0.5);
  }
  ctx.putImageData(img, 0, 0);
}
drawWheel();

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); if (maze.on) queue.push(fire); else actions[0][1](); }
  else if (k === 'm') actions[1][1]();
  else if (k === 'c') actions[2][1]();
  else if (k === 'p') actions[3][1]();
  else if (k === 't') actions[4][1]();
  else if (k === 'r') queue.push(loadPreset);
  else if (k === 'h') setCollapsed(!panel.classList.contains('collapsed'));
});

// ---------- main loop ----------
const clock = document.getElementById('clock');
resizeCanvas(); initBloom();
allocSim(...simDims());
loadPreset();
post({ maze: 'ready', defaults: PART_DEFAULTS, knobs: KNOBS, typeKnobs: TYPE_KNOBS, source: SOURCE_DEFAULTS, board: MAZE_BOARD });
let last = performance.now();

function frame(now) {
  const dtf = Math.min(0.1, (now - last) / 1000); last = now;
  if (resizeCanvas()) {
    initBloom();
    const [w, h] = simDims();
    if (w !== W || h !== H) { allocSim(w, h); if (maze.on) maze.dirty = true; }
  }
  while (queue.length) queue.shift()();
  if (game.on) movePaddles();
  for (let rep = maze.fast && maze.flying ? 3 : 1; rep > 0; rep--) {   // the editor's tests run three sim frames per screen frame
    if (!params.paused) stepSim();
    if (game.on && !params.paused && ++game.frame % 3 === 0) scoreGame();
    if (maze.on && maze.flying && !params.paused && ++maze.frame % 3 === 0) scoreMaze();
  }
  if (maze.dirty) { maze.dirty = false; buildMaze(); }
  if (mark.life > 0) mark.life = Math.max(0, mark.life - dtf / 1.2);
  fitView();
  render();
  drawOverlay(); postView();
  clock.textContent = (Math.round(clockT) || 0).toLocaleString('en-US');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
